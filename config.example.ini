[paths]
# Folder containing the credit-card files (loaded into the Credit tab)
credits = /path/to/your/credits/
# Folder containing the bank/bills files (loaded into the Bank tab)
bills = /path/to/your/Bills/
# Root folder of the family finance exports (Bank/, CreditCards/, Mortgage/, ...) for import_folders.py
pandasbiz = /path/to/PandasBiz/

[inbox]
# Folder the phone saves to (iCloud Drive). Default: iCloud Drive/PandasBiz Inbox
# folder = ~/Library/Mobile Documents/com~apple~CloudDocs/PandasBiz Inbox
# Where imported files are filed by product (defaults to [paths] pandasbiz)
# archive = /path/to/PandasBiz/
